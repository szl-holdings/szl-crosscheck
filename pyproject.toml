[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-crosscheck"
version = "0.3.1"
description = "Cross-implementation receipt verification - two harness chains in, CONSISTENT/DIVERGENT/INCOMPARABLE out"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
license = { text = "Apache-2.0" }

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-crosscheck"
Source = "https://github.com/szl-holdings/szl-crosscheck"
Issues = "https://github.com/szl-holdings/szl-crosscheck/issues"
Changelog = "https://github.com/szl-holdings/szl-crosscheck/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.szl.release]
import_names = ["szl_crosscheck"] # wheel top-level import names; the release gate fails if the built wheel differs
