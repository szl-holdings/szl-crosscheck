[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-crosscheck"
version = "0.2.0"
description = "Cross-implementation receipt verification - two harness chains in, CONSISTENT/DIVERGENT/INCOMPARABLE out"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
